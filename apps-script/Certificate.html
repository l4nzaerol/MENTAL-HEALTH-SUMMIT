<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Certificate of Participation</title>
    <style>
      :root {
        --ink: #143d38;
        --muted: #4d655f;
        --gold: #c4a35a;
        --accent: #1f6f64;
      }
      body {
        margin: 0;
        background: #f3f6f2;
        color: var(--ink);
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .wrap {
        width: min(980px, calc(100% - 24px));
        margin: 24px auto 48px;
      }
      .certificate {
        position: relative;
        aspect-ratio: 1.414 / 1;
        background: #fffcf7;
        border: 10px solid var(--accent);
        outline: 1px solid var(--gold);
        outline-offset: -18px;
        box-shadow: 0 16px 40px rgba(20, 61, 56, 0.12);
      }
      .content {
        position: absolute;
        inset: 8%;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .kicker {
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--gold);
        font-size: 12px;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: clamp(24px, 4vw, 42px);
        margin: 8px 0 0;
      }
      .name {
        font-family: Georgia, serif;
        font-size: clamp(26px, 5vw, 48px);
        margin: 8px 0 0;
        border-bottom: 1px solid var(--gold);
        padding-bottom: 6px;
      }
      .muted {
        color: var(--muted);
      }
      .footer {
        width: 100%;
        margin-top: auto;
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        text-align: left;
        gap: 16px;
      }
      .qr {
        width: 88px;
        height: 88px;
        background: #fff;
      }
      .error {
        background: #fff;
        padding: 24px;
        border-radius: 16px;
      }
      @media print {
        body { background: #fff; }
        .wrap { width: auto; margin: 0; }
        .certificate { box-shadow: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <? if (ok) { ?>
        <article class="certificate">
          <div class="content">
            <p class="kicker">Certificate of Participation</p>
            <h1>Mental Health Summit</h1>
            <p class="muted">This is presented to</p>
            <p class="name"><?= cert.fullName ?></p>
            <p class="muted">
              for completing the seminar and submitting feedback for the venue,
              speakers, and overall program.
            </p>
            <p><strong><?= issuedLabel ?></strong></p>
            <div class="footer">
              <div>
                <p class="muted">ID <?= cert.id ?></p>
                <p class="muted">Scan the QR code to view this certificate</p>
              </div>
              <img class="qr" src="<?!= qrUrl ?>" alt="Certificate QR code" />
            </div>
          </div>
        </article>
      <? } else { ?>
        <div class="error">
          <h1>Certificate not found</h1>
          <p><?= error ?></p>
        </div>
      <? } ?>
    </div>
  </body>
</html>
